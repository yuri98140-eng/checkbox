<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Checkbox Marrom</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="checkbox-container">
    <!-- Checkbox Marcado -->
    <label class="custom-checkbox">
      <input type="checkbox" checked>
      <span class="checkmark"></span>
    </label>

    <!-- Checkbox Desmarcado -->
    <label class="custom-checkbox">
      <input type="checkbox">
      <span class="checkmark"></span>
    </label>
  </div>

</body>
</html>
